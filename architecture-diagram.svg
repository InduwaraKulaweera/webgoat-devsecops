<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>WebGoat single-container architecture</title>
<desc>A Docker host exposes one webgoat container to the public internet on two ports. Inside that single container, WebGoat and its WebWolf companion service run together and share an embedded database.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="360" fill="#ffffff"/>

<text x="340" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Browser / security tester (public internet)</text>
<line x1="260" y1="45" x2="260" y2="88" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="45" x2="420" y2="88" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">:8080</text>
<text x="420" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">:9090</text>

<rect x="60" y="90" width="560" height="240" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="118" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Docker host (docker compose)</text>
<text x="80" y="136" font-family="sans-serif" font-size="12" fill="#5F5E5A">local machine / CI runner</text>

<rect x="90" y="150" width="500" height="160" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="172" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">webgoat container (single image)</text>
<text x="110" y="188" font-family="sans-serif" font-size="12" fill="#185FA5">public network boundary</text>

<rect x="110" y="210" width="150" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="185" y="233" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">WebGoat :8080</text>
<text x="185" y="251" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">lesson app</text>

<rect x="280" y="210" width="150" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="355" y="233" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">WebWolf :9090</text>
<text x="355" y="251" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">companion service</text>

<rect x="450" y="210" width="120" height="56" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="510" y="233" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Embedded DB</text>
<text x="510" y="251" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">per-user data</text>

<line x1="260" y1="238" x2="450" y2="238" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="355" y1="266" x2="490" y2="266" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="185" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Volume: webgoat_data</text>
<text x="185" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">(survives container restarts)</text>
</svg>
