name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./WebGoat
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests

  sast:
    name: "Gate 1: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_RULES: auto

  dependency-scan:
    name: "Gate 2: Dependency / SCA Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Keeps the NVD database between runs so later runs only need a small update.
      # actions/cache saves ONLY when the whole job succeeded, so a half-downloaded
      # database from a failed run is never cached.
      - name: Cache Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: depcheck-data-${{ github.run_id }}
          restore-keys: |
            depcheck-data-

      - name: OWASP Dependency-Check
        working-directory: ./WebGoat
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          KEY="$(printf '%s' "$NVD_API_KEY" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then
            echo "ERROR: NVD API key is empty"
            exit 1
          fi

          chmod +x mvnw

          # The NVD API is sometimes unavailable (HTTP 5xx). Retry ONLY when the
          # NVD database update failed with a 5xx status. Real findings (CVSS >= 9),
          # an invalid key and any other error fail immediately: the gate is not weakened.
          for attempt in 1 2 3; do
            set +e
            ./mvnw org.owasp:dependency-check-maven:13.0.0:check \
              -DnvdApiKey="$KEY" \
              -DsuppressionFile=dependency-check-suppressions.xml \
              -DfailBuildOnCVSS=9 \
              -Dformat=HTML 2>&1 | tee dependency-check.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if grep -Eq "NVD Returned Status Code: 5[0-9][0-9]" dependency-check.log && [ "$attempt" -lt 3 ]; then
              echo "NVD returned a 5xx error (attempt $attempt of 3); waiting 10 minutes before retrying..."
              sleep 600
            else
              exit "$status"
            fi
          done

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: WebGoat/target/dependency-check-report.html

  secrets-scan:
    name: "Gate 3: Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: "Gate 4: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: ./WebGoat
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests

      - name: Build Docker image
        run: docker build -t webgoat-custom:${{ github.sha }} ./WebGoat

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'webgoat-custom:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # fails (blocks) the pipeline on CRITICAL/HIGH findings
