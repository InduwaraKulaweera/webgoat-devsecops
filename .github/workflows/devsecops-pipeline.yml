name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./WebGoat
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests

  sast:
    name: "Gate 1: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_RULES: auto

  dependency-scan:
    name: "Gate 2: Dependency / SCA Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 1) Restore the NVD database saved by an earlier successful update.
      - name: Restore Dependency-Check NVD database
        uses: actions/cache/restore@v4
        with:
          path: .odc-data
          key: odc-data-${{ github.run_id }}
          restore-keys: |
            odc-data-

      # 2) Update the database.
      #    First choice: the NVD REST API (the key is used here). If the NVD API keeps
      #    returning HTTP 5xx, fall back to dependency-check's own NVD data-feed mirror
      #    (documented in the plugin's "Mirroring" docs). That mirror is rebuilt about once
      #    every 24 hours, so in this fallback the data can be up to ~1 day old.
      #    Any other failure (for example an invalid key) fails the step immediately, and
      #    a gate result is never produced from an incomplete database.
      - name: Update NVD database
        working-directory: ./WebGoat
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          KEY="$(printf '%s' "$NVD_API_KEY" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then
            echo "ERROR: NVD API key is empty"
            exit 1
          fi

          chmod +x mvnw
          DATA_DIR="$GITHUB_WORKSPACE/.odc-data"
          MIRROR='https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'

          for attempt in 1 2; do
            set +e
            ./mvnw org.owasp:dependency-check-maven:13.0.0:update-only \
              -DnvdApiKey="$KEY" \
              -DdataDirectory="$DATA_DIR" 2>&1 | tee dependency-check-update.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eq "NVD Returned Status Code: 5[0-9][0-9]" dependency-check-update.log; then
              exit "$status"
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "NVD API returned a 5xx error (attempt $attempt of 2); waiting 2 minutes before retrying..."
              sleep 120
            fi
          done

          echo "::warning::NVD API unavailable (HTTP 5xx). Falling back to the dependency-check NVD mirror; data may be up to ~24 hours old."
          ./mvnw org.owasp:dependency-check-maven:13.0.0:update-only \
            -DnvdDatafeedUrl="$MIRROR" \
            -DdataDirectory="$DATA_DIR"

      # 3) Save the database. Runs only if the update step succeeded (default `if: success()`),
      #    and BEFORE the scan, so a red scan (real findings) still seeds the cache.
      - name: Save Dependency-Check NVD database
        uses: actions/cache/save@v4
        with:
          path: .odc-data
          key: odc-data-${{ github.run_id }}

      # 4) The gate itself: scans using the saved database, no network update.
      #    Fails on any dependency with CVSS >= 9 (threshold unchanged).
      - name: OWASP Dependency-Check (gate)
        working-directory: ./WebGoat
        run: |
          ./mvnw org.owasp:dependency-check-maven:13.0.0:check \
            -DautoUpdate=false \
            -DdataDirectory="$GITHUB_WORKSPACE/.odc-data" \
            -DsuppressionFile=dependency-check-suppressions.xml \
            -DfailBuildOnCVSS=9 \
            -Dformat=HTML

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: WebGoat/target/dependency-check-report.html

  secrets-scan:
    name: "Gate 3: Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: "Gate 4: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: ./WebGoat
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests

      - name: Build Docker image
        run: docker build -t webgoat-custom:${{ github.sha }} ./WebGoat

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'webgoat-custom:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # fails (blocks) the pipeline on CRITICAL/HIGH findings
