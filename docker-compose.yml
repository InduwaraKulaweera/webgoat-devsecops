# Custom-built image containing our secure-coding fixes (see WebGoat/Dockerfile).
# Built locally from the patched source in ./WebGoat -- NOT pulled from Docker Hub.
#
# To build/rebuild after further code changes:
#   docker compose build
# To build and start in one step:
#   docker compose up -d --build

services:
  webgoat:
    build:
      context: ./WebGoat
      dockerfile: Dockerfile
    image: webgoat-custom:latest
    container_name: webgoat
    environment:
      TZ: ${APP_TZ:-Asia/Colombo}
    # Bound to localhost only: WebGoat is intentionally vulnerable and must not be
    # reachable from other machines on the network.
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    volumes:
      - webgoat_data:/home/webgoat/.webgoat

volumes:
  webgoat_data:
